# Mécanique Mobile H.I.S — server functions. Each one checks who is asking itself (the signed-in person's token,
# the customer's secret link, Stripe's signature, GoHighLevel's key in the address, GitHub's ticket, Hermes' one-time
# code), so the platform's own JWT check is off for ALL of them. Every folder of supabase/functions must be named here:
# a function deployed with the CLI without its line would get the platform's check switched on, and the public page
# (publishable key), GoHighLevel's webhooks and the Hermes pairing would be refused before the handler runs
# (tests/api/refonte-terrain.test.mjs compares this file with the folders).
project_id = "wyxvizxabqgvsiiemvfw"

[functions.backup]
verify_jwt = false
[functions.book]
verify_jwt = false
[functions.client]
verify_jwt = false
