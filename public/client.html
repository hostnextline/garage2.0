      try {
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#E7EAEE';
        if (/[#&]l=en\b/.test(location.hash)) document.documentElement.lang = 'en-CA';
        /* the build adds the team app's manifest to every page: a customer's page is not an app to install */
        var noManifest = function () { var l = document.querySelector('link[rel="manifest"]'); if (l) l.parentNode.removeChild(l); };
        var mo = new MutationObserver(noManifest);
        mo.observe(document.head, { childList: true });
        addEventListener('DOMContentLoaded', function () { mo.disconnect(); noManifest(); });
      } catch (e) {}
    </script>
