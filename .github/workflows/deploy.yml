# Publie l'app sur https://hostnextline.github.io/garage2.0/ à chaque changement de la branche main.
# Les tests passent d'abord : si un test échoue, rien n'est publié et l'app en ligne reste la même.
# L'app construite va sur la branche gh-pages (GitHub Pages la sert telle quelle).
name: Publier l'app
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publier
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Construire
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Publier (branche gh-pages)
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "Publication automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
