# Publie l'app à chaque changement de la branche main : sur Vercel (branche « vercel », voir ops/vercel) et sur
# l'ancienne adresse https://hostnextline.github.io/garage2.0/ (branche gh-pages, GitHub Pages).
# Les types (tsc) et les tests passent d'abord : si l'un des deux échoue, rien n'est publié et l'app en ligne reste la même.
# Un changement qui ne touche QUE des fichiers hors de l'app (notes, tests du serveur, migrations, fonctions, scripts de
# sauvegarde, procédures) ne publie rien : sinon chaque téléphone verrait une « nouvelle version » identique. Les
# fonctions et les migrations se publient à part (ops/live/CUTOVER.md). « Run workflow » publie quand même, à la main.
# Les tests de l'app qui lisent supabase/ roulent quand même pour un tel changement : tests-main.yml (ne publie rien).
name: Publier l'app
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'supabase/**'
      - 'ops/live/**'
      - 'ops/sauvegardes/**'
      - 'ops/tests/**'
      - 'CLAUDE.md'
      - 'README.md'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publier
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the date of the last important version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        # its own step, before the tests: a type error stops the publication here, whatever the build step does later
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
        env:
          TZ: America/Toronto   # the garage's clock (Montréal), like the phones and the end-to-end test (R01)
      - name: Construire
        # the version file says when this version was made, what changes, and since when an important version exists
        # (a commit with « [important] » in its message): the phones with an older version then get a notification
        run: |
          export VITE_BUILT_AT="$(git log -1 --format=%cI)"
          # the notes: the last change of the app itself (a commit of notes, tests or publishing says nothing to the team)
          export APP_NOTES="$(git log -1 --first-parent --format=%s -- . ':!CLAUDE.md' ':!docs' ':!README.md' ':!tests' ':!.github' ':!ops' | sed 's/\[important\]//g' | sed 's/^ *//;s/ *$//')"
          export APP_IMPORTANT_SINCE="$(git log --grep='\[important\]' -1 --format=%cI || true)"
          npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          # a version made before this date must update before anything else (only after a harmful build): the
          # repository variable APP_MIN_BUILT_AT (Settings → Secrets and variables → Actions → Variables), empty = none
          APP_MIN_BUILT_AT: ${{ vars.APP_MIN_BUILT_AT }}
          # TomTom's BROWSER key (maps, routes with traffic, addresses; restricted to the app's addresses on
          # developer.tomtom.com): the repository variable TOMTOM_KEY, empty = the free OpenStreetMap services as before
          VITE_TOMTOM_KEY: ${{ vars.TOMTOM_KEY }}
      - name: Publier sur Vercel (branche vercel)
        # the same built app in public/, with the Vercel settings next to it; Vercel publishes each new push
        run: |
          rm -rf ../vercel && mkdir -p ../vercel/public
          cp -r dist/. ../vercel/public/
          cp ops/vercel/vercel.json ../vercel/vercel.json
          cd ../vercel
          git init -q -b vercel
          git config user.name "Publication automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vercel
      - name: Publier (branche gh-pages)
        run: |
          cd dist
          touch .nojekyll
          # Vercel never publishes this branch (it publishes the branch « vercel »)
          printf '{ "git": { "deploymentEnabled": false } }\n' > vercel.json
          git init -q -b gh-pages
          git config user.name "Publication automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
