name: Sauvegarde du garage
on:
  schedule:
    - cron: '23 8 * * *'   # chaque nuit, vers 3 h 23 à Montréal
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write   # le ticket signé par GitHub : aucun mot de passe n'est gardé nulle part
concurrency: sauvegarde
jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger toutes les données
        # une copie qui n'est pas entière : rouge, et le garage note la nuit ratée (backup done, ok false)
        id: copie
        run: node sauvegarde.mjs donnees
      - name: Garder la copie (l'historique du dépôt garde chaque nuit)
        id: garder
        run: |
          git config user.name "Sauvegarde automatique"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A donnees
          if git diff --cached --quiet; then echo "Rien n'a changé depuis la dernière sauvegarde."; exit 0; fi
          git commit -q -m "Sauvegarde du $(date -u +%F)"
          git push -q
      - name: Le dire au garage, puis le rapprochement de la journée
        # APRÈS « Garder la copie », exprès : cette étape finit en rouge quand le rapprochement trouve un écart
        # (GitHub écrit alors au propriétaire), et la sauvegarde de la nuit est déjà gardée quoi qu'il arrive.
        # Un serveur qui ne connaît pas encore « done » ou « recon » : un avertissement, jamais un échec.
        run: node sauvegarde.mjs --fin donnees
      - name: Push refusé — le dire au garage
        # seulement quand « Garder la copie » a échoué (la copie était entière, GitHub l'a refusée) : la nuit reste rouge,
        # le garage la note ratée. Une copie pas entière le dit elle-même (étape « Télécharger »).
        if: ${{ failure() && steps.garder.outcome == 'failure' }}
        run: node sauvegarde.mjs --echec donnees
